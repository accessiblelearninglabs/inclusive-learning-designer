    });
    const A = box(n);
    if (A.x0 < bounds.x0) n.x += bounds.x0 - A.x0;
    if (A.x1 > bounds.x1) n.x -= A.x1 - bounds.x1;
    if (A.y0 < bounds.y0) n.y += bounds.y0 - A.y0;
    if (A.y1 > bounds.y1) n.y -= A.y1 - bounds.y1;
  });
  return moved;
}

function init() {
  const wrap = document.getElementById('canvas-wrap');
  W = wrap.clientWidth;
  narrow = W <= 640;
  H = narrow ? Math.round(W * 1.1) : wrap.clientHeight;
  const svg = document.getElementById('svg');
  svg.innerHTML = '';
  svg.setAttribute('viewBox', `0 0 ${W} ${H}`);
  svg.style.height = narrow ? H + 'px' : '';
  if (sim) sim.stop();

  const probe = el('g', { 'aria-hidden': 'true', opacity: 0 }, svg);
  nodes.forEach(n => {
    const lines = n.label.split('\n');
    n.lines = narrow ? 0 : lines.length; n.lw = 0;
    if (!narrow) lines.forEach(t => { const x = el('text', { class: 'node-label' }, probe); x.textContent = t; n.lw = Math.max(n.lw, x.getBBox().width); });
  });
  probe.remove();

  const wr = wrap.getBoundingClientRect();
  obstacles = narrow ? [] : ['title-block', 'legend', 'hint'].map(id => {
    const r = document.getElementById(id).getBoundingClientRect();
    return { x0: r.left - wr.left - 12, x1: r.right - wr.left + 12, y0: r.top - wr.top - 12, y1: r.bottom - wr.top + 12 };
  });
  bounds = narrow ? { x0: 8, x1: W - 8, y0: 8, y1: H - 8 } : { x0: 24, x1: W - 24, y0: 24, y1: H - 24 };

  const centres = {
    design:  { x: W * 0.28, y: H * 0.38 },
    access:  { x: W * 0.72, y: H * 0.38 },
    systems: { x: W * 0.50, y: H * 0.72 },
  };
  const rand = d3.randomLcg(42);
  nodes.forEach(n => { n.x = centres[n.cluster].x + (rand() - 0.5) * 120; n.y = centres[n.cluster].y + (rand() - 0.5) * 120; n.vx = n.vy = 0; });
  const links = edges.map(e => ({ source: e.source, target: e.target, strength: e.strength }));
  const k = narrow ? 0.55 : 1;
  sim = d3.forceSimulation(nodes).randomSource(rand)
    .force('link', d3.forceLink(links).id(d => d.id)
      .distance(d => (d.strength === 'strong' ? 115 : 175) * k)
      .strength(d => d.strength === 'strong' ? 0.7 : 0.2))
    .force('charge', d3.forceManyBody().strength(-320 * k))
    .force('cluster', alpha => nodes.forEach(n => { const c = centres[n.cluster]; n.vx += (c.x - n.x) * 0.22 * alpha; n.vy += (c.y - n.y) * 0.22 * alpha; }))
    .force('collision', d3.forceCollide().radius(d => rad(d) + (narrow ? 10 : 36)))
    .force('x', d3.forceX(W / 2).strength(0.04))
    .force('y', d3.forceY(H / 2).strength(0.04))
    .stop();
  for (let i = 0; i < 400; i++) { sim.tick(); separate(0.5); }
  for (let i = 0; i < 400 && separate(1); i++);
  // centre the layout vertically in the free band between the title (if shown) and the legend
  if (!narrow) {
    const tb = document.getElementById('title-block'), lg = document.getElementById('legend');
    const shown = getComputedStyle(tb).display !== 'none';
    const top = shown ? tb.getBoundingClientRect().bottom - wr.top + 24 : 24;
    const bottom = lg.getBoundingClientRect().top - wr.top - 16;
    let y0 = Infinity, y1 = -Infinity;
    nodes.forEach(n => { const b = box(n); y0 = Math.min(y0, b.y0); y1 = Math.max(y1, b.y1); });
    const dy = (top + bottom) / 2 - (y0 + y1) / 2;
    nodes.forEach(n => { n.y += dy; });
    for (let i = 0; i < 200 && separate(1); i++);
  }

  const ge = el('g', { class: 'edges', 'aria-hidden': 'true' }, svg);
  edgeEls = edges.map(e => {
    const line = el('line', { class: 'edge' + (e.strength === 'strong' ? ' strong' : '') }, ge);
    line._e = e; return line;
  });
  const gn = el('g', { class: 'nodes' }, svg);
  nodeEls = {};
  nodes.forEach(n => {
    const g = el('g', {
      class: 'node-group', tabindex: 0, role: 'button', 'aria-pressed': 'false',
      'aria-label': `${n.num}. ${n.name}. ${clusterNames[n.cluster]}. ${n.status}.`
    }, gn);
    const r = rad(n);
    el('circle', { class: 'node-ring', r: r + 4 }, g);
    el('circle', { class: 'node-circle', r, fill: clusterColors[n.cluster], opacity: 0.92 }, g);
    const num = el('text', { class: 'node-num', dy: '0.05em', 'aria-hidden': 'true' }, g); num.textContent = n.num;
    const tg = el('g', { 'aria-hidden': 'true' }, g);
    n.label.split('\n').forEach((t, i) => {
      const x = el('text', { class: 'node-label', 'text-anchor': 'middle', x: 0, y: r + 14 + i * 14 }, tg); x.textContent = t;
    });
    g.addEventListener('mouseenter', ev => { if (activeNode || dragging) return; highlight(n); showTooltip(n, ev); });
    g.addEventListener('mouseleave', () => { if (activeNode || dragging) return; resetHighlight(); hideTooltip(); });
    g.addEventListener('click', ev => { ev.stopPropagation(); if (dragMoved) return; toggle(n, ev, false); });
    g.addEventListener('keydown', ev => {
      if (ev.key === 'Enter' || ev.key === ' ') { ev.preventDefault(); toggle(n, null, true); }
      if (ev.key === 'Escape') { ev.preventDefault(); clearActive(true); }
    });
    nodeEls[n.id] = g;
  });
  render();

  // drag to rearrange, as in the Fieldwork map; labels stay clear while moving
  let dragging = false, dragMoved = false;
  window.dragging = false;
  d3.selectAll('.node-group').data(nodes).call(d3.drag()
    .on('start', (ev, d) => { dragging = true; dragMoved = false; hideTooltip(); })
    .on('drag', (ev, d) => { dragMoved = true; d.x = ev.x; d.y = ev.y; for (let i = 0; i < 6; i++) separate(0.6); d.x = ev.x; d.y = ev.y; render(); })
    .on('end', () => { for (let i = 0; i < 200 && separate(1); i++); render(); dragging = false; setTimeout(() => { dragMoved = false; }, 0); }));

  svg.onclick = () => { if (activeNode) clearActive(false); };

  const key = document.getElementById('key');
  key.innerHTML = '';
  nodes.forEach(n => {
    const li = document.createElement('li');
    li.innerHTML = `<span class="k-num">${n.num}</span>`;
    const b = document.createElement('button'); b.type = 'button'; b.textContent = n.name;
    b.addEventListener('click', () => toggle(n, null, true));
    li.appendChild(b); key.appendChild(li);
  });

  if (activeNode) { const n = byId[activeNode]; activeNode = null; toggle(n, null, false); }
}

function render() {
  edgeEls.forEach(l => {
    const a = byId[l._e.source], b = byId[l._e.target];
    l.setAttribute('x1', a.x); l.setAttribute('y1', a.y); l.setAttribute('x2', b.x); l.setAttribute('y2', b.y);
  });
  nodes.forEach(n => nodeEls[n.id].setAttribute('transform', `translate(${n.x},${n.y})`));
}

function highlight(d) {
  const near = new Set(neighbours(d.id));
  nodes.forEach(n => nodeEls[n.id].classList.toggle('dimmed', n.id !== d.id && !near.has(n.id)));
  edgeEls.forEach(l => {
    const on = l._e.source === d.id || l._e.target === d.id;
    l.classList.toggle('highlighted', on); l.classList.toggle('dimmed', !on);
  });
}
function resetHighlight() {
  nodes.forEach(n => { nodeEls[n.id].classList.remove('dimmed', 'active'); nodeEls[n.id].setAttribute('aria-pressed', 'false'); });
  edgeEls.forEach(l => l.classList.remove('highlighted', 'dimmed'));
}

const tt = document.getElementById('tooltip');
function showTooltip(d, ev, pinned) {
  tt.querySelector('.tt-cluster').textContent = clusterFocus[d.cluster];
  tt.querySelector('.tt-title').textContent = d.num + '. ' + d.name;
  tt.querySelector('.tt-desc').textContent = d.desc;
  tt.querySelector('.tt-meta').textContent = d.status;
  const ev_ = tt.querySelector('.tt-ev');
  ev_.innerHTML = '';
  if (pinned) {
    if (d.ev.length) d.ev.forEach(x => {
      const li = document.createElement('li'), a = document.createElement('a');
      a.href = x[1]; a.target = '_top'; a.textContent = x[0]; li.appendChild(a); ev_.appendChild(li);
    });
    else { const li = document.createElement('li'); li.textContent = 'No public resource yet.'; ev_.appendChild(li); }
  }
  ev_.style.display = pinned ? '' : 'none';
  const con = neighbours(d.id).map(id => flat(byId[id].label));
  tt.querySelector('.tt-links').textContent = con.length ? 'Connected to: ' + con.join(', ') : '';
  position(d, ev);
  tt.classList.add('visible');
  tt.classList.toggle('pinned', !!pinned);
  tt.setAttribute('aria-hidden', pinned ? 'false' : 'true');
}
function position(d, ev) {
  const rect = document.getElementById('canvas-wrap').getBoundingClientRect();
  const svgRect = document.getElementById('svg').getBoundingClientRect();
  let x = ev && ev.clientX ? ev.clientX - rect.left : (svgRect.left - rect.left) + d.x;
  let y = ev && ev.clientY ? ev.clientY - rect.top : (svgRect.top - rect.top) + d.y;
  const ttW = Math.min(284, rect.width - 24), ttH = tt.offsetHeight || 220;
  const left = x + 18 + ttW > rect.width ? Math.max(12, x - ttW - 18) : x + 18;
  const top = Math.max(12, Math.min(y - 10, (narrow ? svgRect.height : rect.height) - ttH - 12));
  tt.style.left = left + 'px'; tt.style.top = top + 'px';
}
function hideTooltip() { tt.classList.remove('visible', 'pinned'); tt.setAttribute('aria-hidden', 'true'); }

function toggle(d, ev, fromKeyboard) {
  if (activeNode === d.id) { clearActive(fromKeyboard); return; }
  activeNode = d.id;
  resetHighlight(); highlight(d);
  nodeEls[d.id].classList.add('active'); nodeEls[d.id].setAttribute('aria-pressed', 'true');
  showTooltip(d, ev, true);
  document.getElementById('announce').textContent = 'Showing ' + d.num + ', ' + d.name + '.';
  if (fromKeyboard) tt.querySelector('.tt-title').focus();
}
function clearActive(returnFocus) {
  const was = activeNode; activeNode = null;
  resetHighlight(); hideTooltip();
  if (returnFocus && was) nodeEls[was].focus();
}
tt.addEventListener('keydown', ev => { if (ev.key === 'Escape') { ev.preventDefault(); clearActive(true); } });
tt.addEventListener('click', ev => ev.stopPropagation());

init();
if (document.fonts && document.fonts.ready) document.fonts.ready.then(init);
let rt; window.addEventListener('resize', () => { clearTimeout(rt); rt = setTimeout(init, 150); });
</script>
</body>
</html>
